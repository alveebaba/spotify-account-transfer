name: Bug report
description: Report a reproducible problem without sharing account data or credentials.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never attach config.json, data/, real library backups, tokens, account emails or personal screenshots. Report vulnerabilities privately through Security, not here."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected behavior and a sanitized error message.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a minimal example with fake names and identifiers.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Python version, browser, release or commit"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no credentials, personal account data or private backups.
          required: true
